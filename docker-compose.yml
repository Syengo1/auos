version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: autoos
      POSTGRES_PASSWORD: autoos_password
      POSTGRES_DB: autoos_db
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: autoos_admin
      MINIO_ROOT_PASSWORD: autoos_password123
    ports:
      - "9000:9000" # API Port (S3 compatible)
      - "9001:9001" # Web UI Console
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  redisdata:
  miniodata: